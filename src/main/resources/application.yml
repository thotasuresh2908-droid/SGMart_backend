# SGMart API - settings shared by every environment.
# Secrets come from environment variables (see .env.example); never put them in this file.
server:
  port: ${PORT:9001}
spring:
  application:
    name: sgmart-api

  servlet:
    multipart:
      max-file-size: 5MB          # product photos
      max-request-size: 6MB

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:sgmart}?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: ${DB_USER:sgmart_app}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # Flyway owns the schema; Hibernate only checks the entities match it
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.default_batch_fetch_size: 50   # loads order items for a page of orders in one query

  flyway:
    locations: classpath:db/migration
    placeholders:
      owner_email: ${SGMART_OWNER_EMAIL}
      owner_name: ${SGMART_OWNER_NAME:Store Owner}
      store_phone: ${SGMART_STORE_PHONE}

  security:
    oauth2:
      client:
        registration:
          # Two sign-in buttons on the same Google OAuth client.
          google-admin:
            provider: google
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile
            redirect-uri: "${sgmart.public-url}/login/oauth2/code/{registrationId}"
          google-customer:
            provider: google
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile
            redirect-uri: "${sgmart.public-url}/login/oauth2/code/{registrationId}"

server:
  servlet:
    session:
      timeout: 7d
      cookie:
        name: SGMART_SESSION
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health

sgmart:
  public-url: ${SGMART_PUBLIC_URL:http://localhost:5173}
  cors-allowed-origins: ${SGMART_CORS_ORIGINS:http://localhost:5173}
  images:
    dir: ${SGMART_IMAGES_DIR:data/images}   # product photos folder; mount as a volume in production
  captcha:
    turnstile-secret: ${TURNSTILE_SECRET:}   # empty = CAPTCHA off (local development only)
  orders:
    max-per-ip-per-10-minutes: ${SGMART_MAX_ORDERS_PER_IP:5}
