
# SGMart API - Shared configuration

server:
  port: ${PORT:9001}

  forward-headers-strategy: framework

  servlet:
    session:
      timeout: 7d
      cookie:
        name: SGMART_SESSION
        http-only: true
        secure: true
        same-site: none

spring:
  application:
    name: sgmart-api

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}

    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:1}
      max-lifetime: ${DB_MAX_LIFETIME_MS:300000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:120000}
      keepalive-time: ${DB_KEEPALIVE_MS:60000}
      connection-timeout: 30000

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.default_batch_fetch_size: 50

  flyway:
    locations: classpath:db/migration

    placeholders:
      owner_email: ${SGMART_OWNER_EMAIL}
      owner_name: ${SGMART_OWNER_NAME:Store Owner}
      store_phone: ${SGMART_STORE_PHONE}

  security:
    oauth2:
      client:
        registration:

          # Admin Google Login
          google-admin:
            provider: google
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
            redirect-uri: "${SGMART_BACKEND_URL:https://sgmart-backend.onrender.com}/login/oauth2/code/{registrationId}"

          # Customer Google Login
          google-customer:
            provider: google
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - email
              - profile
            redirect-uri: "${SGMART_BACKEND_URL:https://sgmart-backend.onrender.com}/login/oauth2/code/{registrationId}"

        provider:
          google:
            issuer-uri: https://accounts.google.com

management:
  endpoints:
    web:
      exposure:
        include: health

sgmart:

  # React frontend URL
  public-url: ${SGMART_PUBLIC_URL:https://sg-mart-ui.vercel.app}

  # React frontend CORS origin
  cors-allowed-origins: ${SGMART_CORS_ORIGINS:https://sg-mart-ui.vercel.app}

  images:
    dir: ${SGMART_IMAGES_DIR:data/images}

  captcha:
    turnstile-secret: ${TURNSTILE_SECRET:}

  orders:
    max-per-ip-per-10-minutes: ${SGMART_MAX_ORDERS_PER_IP:5}
