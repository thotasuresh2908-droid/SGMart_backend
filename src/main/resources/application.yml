 # SGMart API - settings shared by every environment.
# Secrets come from environment variables (see .env.example).

server:
  port: ${PORT:9001}          # Render and other hosts can set PORT; 9001 otherwise
  servlet:
    session:
      timeout: 7d
      cookie:
        name: SGMART_SESSION
        http-only: true
        same-site: lax

spring:
  application:
    name: sgmart-api

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  datasource:
    # Full JDBC URL from the DB_URL env var. Keep the time-zone settings, SGMART stores all times in UTC:
    # jdbc:mysql://<host>:<port>/<db>?sslMode=REQUIRED&characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:1}
      max-lifetime: ${DB_MAX_LIFETIME_MS:300000}     # 5 min: replace connections before the cloud DB closes them
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:120000}     # 2 min: must be less than max-lifetime
      keepalive-time: ${DB_KEEPALIVE_MS:60000}       # 1 min: keeps idle connections alive
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.default_batch_fetch_size: 50

  flyway:
    locations: classpath:db/migration
    placeholders:
      owner_email: ${SGMART_OWNER_EMAIL}
      owner_name: ${SGMART_OWNER_NAME:Store Owner}
      store_phone: ${SGMART_STORE_PHONE}

  security:
    oauth2:
      client:
        registration:
          google-admin:
            provider: google
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile
            redirect-uri: "${sgmart.public-url}/login/oauth2/code/{registrationId}"
          google-customer:
            provider: google
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile
            redirect-uri: "${sgmart.public-url}/login/oauth2/code/{registrationId}"

management:
  endpoints:
    web:
      exposure:
        include: health

sgmart:
  public-url: ${SGMART_PUBLIC_URL:http://localhost:5173}
  cors-allowed-origins: ${SGMART_CORS_ORIGINS:http://localhost:5173}
  images:
    dir: ${SGMART_IMAGES_DIR:data/images}
  captcha:
    turnstile-secret: ${TURNSTILE_SECRET:}
  orders:
    max-per-ip-per-10-minutes: ${SGMART_MAX_ORDERS_PER_IP:5}
